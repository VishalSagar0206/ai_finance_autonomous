[project]
name = "ai_finance_autonomous"
version = "0.1.1"
requires-python = ">=3.12"

# Minimal dependencies required for the deterministic/offline agent run.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
ui = [
    "streamlit>=1.30",
    "altair>=5.0",
    "graphviz>=0.20",
    "streamlit-agraph>=0.0.45",
]
live = [
    "langchain>=0.1.20",
    "langchain-community>=0.0.38",
    "langchain-core>=0.1.52",
    "langgraph>=0.0.40",
    "langchain-google-genai>=1.0.4",
    "yfinance>=0.2.40",
    "chromadb>=0.5.0",
    "alpaca-trade-api>=3.0.0",
    "torch>=2.0",
    "scikit-learn>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
